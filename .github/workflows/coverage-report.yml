name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]  # Optional: also run on PRs

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required for committing badges back to repo

    steps:
      - uses: actions/checkout@v4

      - name: Set up the Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'  # Eclipse Temurin is the successor to AdoptOpenJDK
          cache: 'maven'  # Caches Maven dependencies for faster builds

      - name: Build with Maven
        run: mvn -B test

      - name: Generate JaCoCo Badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: true
          jacoco-csv-file: target/site/jacoco/jacoco.csv

      - name: Log coverage percentage
        run: |
          echo "coverage = ${{ steps.jacoco.outputs.coverage }}"
          echo "branch coverage = ${{ steps.jacoco.outputs.branches }}"

      - name: Commit and push the badge (if it changed)
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: 'Update coverage badges'
          add: '*.svg'

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()  # Upload even if tests fail
        with:
          name: jacoco-report
          path: target/site/jacoco/