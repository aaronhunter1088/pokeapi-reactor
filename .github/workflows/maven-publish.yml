name: CD Pipeline

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Publish package
        run: mvn clean --batch-mode deploy
        env:
          GITHUB_TOKEN: ${{ secrets. GITHUB_TOKEN }}